<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Circle to Fix</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 270px;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    h2 { font-size: 14px; margin: 0 0 6px 0; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    p { font-size: 11px; color: #94a3b8; margin: 0 0 12px 0; line-height: 1.4; }
    .shortcut-badge {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 3px 6px;
      border-radius: 4px;
      color: #fbbf24;
      font-family: monospace;
      font-size: 11px;
      font-weight: 700;
    }
    .btn {
      width: 100%;
      background: #e11d48;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: #be123c; }
  </style>
</head>
<body>
  <h2>⭕ Circle to Fix</h2>
  <p>Circle any design or code flaw on this page to create a ready-to-paste prompt for your coding agent.</p>
  
  <div style="margin-bottom: 12px; font-size: 11px;">
    Shortcut: <span class="shortcut-badge">Alt + C</span>
  </div>

  <button id="btnStartDrawing" class="btn">
    <span>✏️</span> Start Drawing Mode
  </button>

  <script src="popup.js"></script>
</body>
</html>
